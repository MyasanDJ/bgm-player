<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BGM Player Ultimate</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="player" class="player">
  <div class="topbar" id="dragHandle">
    <div class="brand"><span class="hex"></span> BGM PLAYER</div>
    <div class="topButtons">
      <button id="miniBtn" title="コンパクト">▣</button>
      <button id="closeBtn" title="閉じる">×</button>
    </div>
  </div>

  <div class="content">
    <div class="cover">
      <img id="coverImg" src="cover.jpg" onerror="this.style.display='none'">
      <div class="coverFallback">♪</div>
    </div>

    <div class="info">
      <div class="status">NOW PLAYING</div>
      <div id="title" class="title">BGM</div>
      <div class="format">MP3 / M4A / WAV</div>

      <canvas id="visualizer" width="260" height="70"></canvas>

      <div class="timeRow">
        <span id="current">0:00</span>
        <input id="seek" type="range" min="0" value="0">
        <span id="duration">0:00</span>
      </div>

      <div class="controls">
        <button id="play">▶</button>
        <button id="loop" class="active">🔁</button>
        <button id="mute">🔊</button>
      </div>

      <div class="volumeRow">
        <span>VOL</span>
        <input id="volume" type="range" min="0" max="100" value="50">
        <span id="volText">50%</span>
      </div>
    </div>
  </div>

  <div class="playlist">
    <button data-src="bgm.mp3" data-type="audio/mpeg">bgm.mp3</button>
    <button data-src="bgm.m4a" data-type="audio/mp4">bgm.m4a</button>
    <button data-src="bgm.wav" data-type="audio/wav">bgm.wav</button>
  </div>

  <audio id="audio" loop preload="auto">
    <source src="bgm.mp3" type="audio/mpeg">
    <source src="bgm.m4a" type="audio/mp4">
    <source src="bgm.wav" type="audio/wav">
  </audio>
</div>

<script src="player.js"></script>
</body>
</html>

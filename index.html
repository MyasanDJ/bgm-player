<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BGM Player</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="player">

<div class="title">
🎵 BGM PLAYER
</div>

<div class="song">
Now Playing<br>
<strong>bgm.m4a</strong>
</div>

<button id="play">
▶ 再生
</button>

<div class="volumeBox">

🔊

 <div class="visualizer">
  <span></span>
  <span></span>
  <span></span>
  <span></span>
  <span></span>
  <span></span>
  <span></span>
  <span></span>
</div>

<div class="buttons">
  <button id="mini">📦</button>
</div> 

<input
type="range"
id="volume"
min="0"
max="100"
value="50">

</div>

<audio id="audio" loop>

<source src="bgm.m4a" type="audio/mp4">

</audio>

</div>

<script src="player.js"></script>

</body>
</html>
